name: weekly-rank-reminder
on:
  schedule: [{cron: "0 0 * * MON"}]
  workflow_dispatch:
jobs:
  remind:
    runs-on: ubuntu-latest
    permissions: {issues: write}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - id: prompt
        run: |
          python3 scripts/weekly_rank.py > /tmp/prompt.txt
          echo "prompt<<EOF" >> "$GITHUB_OUTPUT"
          cat /tmp/prompt.txt >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
      - uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title: `Weekly AI re-ranking — ${new Date().toISOString().slice(0,10)}`,
              body: `A human must review and merge. Steps: run \`scripts/weekly_rank.py\`, edit \`data/rankings.json\`, run \`scripts/validate.py\`, snapshot to \`data/history/\`, commit.\n\n\`\`\`\n${process.env.PROMPT}\n\`\`\`\``,
            });
        env: {PROMPT: "${{ steps.prompt.outputs.prompt }}"}
